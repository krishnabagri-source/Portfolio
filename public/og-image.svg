<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09090F"/>
      <stop offset="50%" stop-color="#121124"/>
      <stop offset="100%" stop-color="#09090F"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#glowLeft)"/>
  <rect width="1200" height="630" fill="url(#glowRight)"/>

  <!-- Border Card -->
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="#171725" fill-opacity="0.7" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>

  <!-- Brand badge -->
  <rect x="80" y="80" width="180" height="40" rx="20" fill="#8B5CF6" fill-opacity="0.15" stroke="#8B5CF6" stroke-opacity="0.3"/>
  <circle cx="102" cy="100" r="5" fill="#38BDF8"/>
  <text x="120" y="105" font-family="'JetBrains Mono', monospace" font-size="14" fill="#A78BFA" font-weight="600">krishna.dev</text>

  <!-- Main heading -->
  <text x="80" y="220" font-family="'Inter', sans-serif" font-size="68" font-weight="800" fill="#F8FAFC">
    Hi, I'm <tspan fill="url(#textGrad)">Krishna Bagri</tspan>
  </text>

  <!-- Subtitle -->
  <text x="80" y="290" font-family="'Inter', sans-serif" font-size="36" font-weight="600" fill="#F8FAFC" fill-opacity="0.9">
    Software Engineer in the Making
  </text>

  <!-- Bio note -->
  <text x="80" y="350" font-family="'Inter', sans-serif" font-size="22" fill="#94A3B8">
    B.Tech Computer Science &amp; Engineering @ MAIT Delhi
  </text>

  <!-- Skill Badges -->
  <g transform="translate(80, 420)">
    <rect x="0" y="0" width="100" height="44" rx="12" fill="#38BDF8" fill-opacity="0.1" stroke="#38BDF8" stroke-opacity="0.3"/>
    <text x="50" y="28" font-family="'JetBrains Mono', monospace" font-size="16" fill="#38BDF8" text-anchor="middle" font-weight="600">C++</text>

    <rect x="120" y="0" width="120" height="44" rx="12" fill="#8B5CF6" fill-opacity="0.1" stroke="#8B5CF6" stroke-opacity="0.3"/>
    <text x="180" y="28" font-family="'JetBrains Mono', monospace" font-size="16" fill="#A78BFA" text-anchor="middle" font-weight="600">Python</text>

    <rect x="260" y="0" width="110" height="44" rx="12" fill="#38BDF8" fill-opacity="0.1" stroke="#38BDF8" stroke-opacity="0.3"/>
    <text x="315" y="28" font-family="'JetBrains Mono', monospace" font-size="16" fill="#38BDF8" text-anchor="middle" font-weight="600">React</text>

    <rect x="390" y="0" width="160" height="44" rx="12" fill="#8B5CF6" fill-opacity="0.1" stroke="#8B5CF6" stroke-opacity="0.3"/>
    <text x="470" y="28" font-family="'JetBrains Mono', monospace" font-size="16" fill="#A78BFA" text-anchor="middle" font-weight="600">TypeScript</text>

    <rect x="570" y="0" width="130" height="44" rx="12" fill="#38BDF8" fill-opacity="0.1" stroke="#38BDF8" stroke-opacity="0.3"/>
    <text x="635" y="28" font-family="'JetBrains Mono', monospace" font-size="16" fill="#38BDF8" text-anchor="middle" font-weight="600">DSA &amp; ML</text>
  </g>
</svg>
